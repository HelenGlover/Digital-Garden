
title:               Helen Y. Glover
include:             ['_pages']
exclude:             ['For later', '_thoughts', '_includes/notes_graph.json', 'scripts', 'Gemfile', 'Gemfile.lock', 'README.md', 'netlify.toml']
url:                 'https://helenyglover.com'
baseurl:             '/writing'

# If you are using a host that cannot resolve URLs that do
# not end with .html (such as Neocities), set this to 'true'.
use_html_extension:  false

# Set to `true` to open non-internal links in new tabs, or
# set to `false` to open non-internal links in current tab.
open_external_links_in_new_tab: true

# Set to `true` to replace tweet URLs with Twitter embeds.
# Note that doing so will negatively the reader's privacy
# as their browser will communicate with Twitter's servers.
embed_tweets: false


permalink:           pretty
relative_permalinks: false

plugins:
  - jekyll-last-modified-at
  - jekyll-sitemap
  
sass:
  sass_dir:          _sass
  style:            :compressed

collections:
  thoughts:
    output: false
  notes:
    output: true
    permalink: /:slug

defaults:
  - scope:
      path: "**/*"
    values:
      layout: "default"
  - scope:
      path: "_notes/**/*.md"
    values:
      layout: "note"

# Fallback metadata for pages without descriptions or featured images.
description: Helen Y. Glover's writing on civic technology, independent research, and community organizing.
image: /assets/civictech.png
